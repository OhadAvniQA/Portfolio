name: E2E Tests

on:
  push:
    paths:
      - 'playwright-e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'playwright-e2e/**'
  schedule:
    - cron: '0 6 * * *' # nightly regression, 06:00 UTC
  workflow_dispatch:
    inputs:
      project:
        description: 'Browser project to run'
        type: choice
        default: chromium
        options: [chromium, firefox]
      grep:
        description: 'Only run tests matching this pattern (optional)'
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: playwright-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ inputs.project || 'chromium' }}

      - name: Run tests
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ORG_ID: ${{ secrets.ORG_ID }}
          POLLS_ORG_ID: ${{ secrets.POLLS_ORG_ID }}
          CHALLENGE_ORG_ID: ${{ secrets.CHALLENGE_ORG_ID }}
          CHALLENGE_ID: ${{ secrets.CHALLENGE_ID }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
        run: npx playwright test --project=${{ inputs.project || 'chromium' }} ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-e2e/playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: playwright-e2e/test-results/
          retention-days: 7
